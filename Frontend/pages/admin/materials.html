        </header>

        <!-- Main content -->
        <main id="main">

        <!-- Add materials form -->
        <details class="add-materials-details">
                <summary>Ajouter une ressources</summary>

            <!-- <h2>Ajouter une ressources</h2> -->
            <section class="add-materials">
                <div class="loader" id="loader" style="display: none;"></div> 

                <form id="add-materials-form" enctype="multipart/form-data">
                    <!-- subjects select -->
                    <section class="select-subject">
                            <label for="subject_id">Matière : </label>
                            <select name="subject_id" id="subjects_select" aria-label="Sélectionner la matière concernée" required>
                                
                            </select>
                    </section>

                    <!-- Semestre select -->
                    <section>
                            <label for="semester">Semestre : </label>
                            <select name="semester" id="semester" aria-label="Sélectionner le semestre" required>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                                <option value="6">6</option>
                            </select>
                    </section>

                    <!-- type select -->
                    <section>
                            <label for="type">Type : </label>
                            <select name="type" id="type" aria-label="Sélectionner le type de ressource" required>
                                <option value="COURS">COURS</option>
                                <option value="TD">TD</option>
                                <option value="EXAM">EXAM</option>
                            </select>
                    </section>
                    
                    <!-- session select -->
                    <section>
                            <label for="session">Session : </label>
                            <select name="session" id="session" aria-label="Sélectionner la session" required>
                                <option value="Normal">Normal</option>
                                <option value="Rattrapage">Rattrapage</option>
                                <option value="none">Cours</option>
                            </select>
                    </section>
                    
                    <!-- year_academic select -->
                    <section>
                            <label for="year_academic">Année académique : </label>
                            <select name="year_academic" id="year_academic" aria-label="Sélectionner l'année académique" required>
                                <option value="2025-2026">2025-2026</option>
                                <option value="2026-2027">2026-2027</option>
                                <option value="2027-2028">2027-2028</option>
                            </select>
                    </section>

                    <!-- file input -->
                    <section>
                            <label for="file">Fichier : </label>
                            <input type="file" name="file" id="file" aria-label="Sélectionner le fichier à télécharger" accept=".pdf" required>
                    </section>

                    <!-- submit button -->
                    <section>
                            <button type="submit" id="add-btn" class="add-btn">Ajouter</button>
                    </section>
                </form>
            </section>
        </details>

        <!-- Materials list -->
        <section class="materials-list">
            <h2>Liste des ressources : 20 derniers ressources</h2>

            <section class="admin-cards">

            </section>

            
        </section>

        </main>
    </div>
